<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay — an open-world crime story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0b14;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(180deg, #2b1e4d 0%, #c65a7a 55%, #ff9e57 100%);
  }
  canvas {
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    display: block;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
